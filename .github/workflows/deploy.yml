name: Deploy to Cloudflare

# Every push to main: run the checks, then deploy the API Worker and both frontends.
# Needs (repo Settings → Secrets and variables → Actions):
#   secret   CLOUDFLARE_API_TOKEN   (Workers Scripts:Edit, Pages:Edit, Workers Routes:Edit, Zone:Read)
#   variable CLOUDFLARE_ACCOUNT_ID
#   variables VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#             VITE_FIREBASE_APP_ID, VITE_API_URL (https://api.veeracloud.shop), VITE_TURNSTILE_SITE_KEY (optional)
# Worker secrets are set once with `wrangler secret put` (see DEPLOYMENT.md), not here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    # Skipped until Cloudflare is connected (the account id variable is set).
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Deploy API Worker
        working-directory: apps/api
        run: npx wrangler deploy --env production

      - name: Build frontends
        run: |
          npm run build -w @havins/admin
          npm run build -w @havins/webmail

      - name: Deploy admin console (Pages)
        run: |
          npx wrangler pages project create veeracloud-admin --production-branch main || true
          npx wrangler pages deploy apps/admin/dist --project-name veeracloud-admin --branch main --commit-dirty=true

      - name: Deploy webmail (Pages)
        run: |
          npx wrangler pages project create veeracloud-webmail --production-branch main || true
          npx wrangler pages deploy apps/webmail/dist --project-name veeracloud-webmail --branch main --commit-dirty=true
